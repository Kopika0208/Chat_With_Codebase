<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RepoMind</title>
    
    <!-- Local Fonts -->

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        /* Font Families */
        @font-face {
            font-family: "Geist Regular";
            src: url("./fonts/Geist-Regular.ttf") format("truetype");
            font-weight: normal;
        }

        @font-face {
            font-family: "Geist Medium";
            src: url("./fonts/Geist-Medium.ttf") format("truetype");
            font-weight: 500;
        }

        @font-face {
            font-family: "Geist Mono Regular";
            src: url("./fonts/GeistMono-Regular.ttf") format("truetype");
            font-weight: normal;
        }

        @font-face {
            font-family: "Geist Mono Medium";
            src: url("./fonts/GeistMono-Medium.ttf") format("truetype");
            font-weight: 500;
        }

        @font-face {
            font-family: "Geist Pixel Grid";
            src: url("./fonts/GeistPixel-Grid.ttf") format("truetype");
            font-weight: normal;
        }

        body {
            font-family: 'Geist Regular', sans-serif;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        h1, .modal-title {
            font-family: 'Geist Pixel Grid', sans-serif;
        }

        .panel-title, .stat-label {
            font-family: 'Geist Regular', sans-serif;
        }

        .code-content {
            font-family: 'Geist Mono Regular', monospace;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stat-card {
            animation: slideUp 0.5s ease backwards;
        }

        .stat-card:nth-child(1) { animation-delay: 0.1s; }
        .stat-card:nth-child(2) { animation-delay: 0.2s; }
        .stat-card:nth-child(3) { animation-delay: 0.3s; }
        .stat-card:nth-child(4) { animation-delay: 0.4s; }
        .stat-card:nth-child(5) { animation-delay: 0.5s; }

        /* Gradient Text */
        .gradient-text {
            color: #e5e7eb;
        }

        .gradient-stat-value {
            color: #e5e7eb;
        }

        /* Gradient Buttons */
        .gradient-btn {
            background: #4b5563;
        }

        /* Stat Card Styling */
        .stat-card {
            position: relative;
            overflow: hidden;
            background: transparent;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: #6b7280;
            opacity: 0.6;
        }

        .stat-card:hover {
            background: transparent;
        }

        /* Modal Animation */
        .modal {
            animation: fadeIn 0.2s ease;
        }

        .modal-content {
            animation: slideUp 0.3s ease;
        }

        /* Gradient Backgrounds */

        .gradient-header {
            background: #0B0B0B;
        }

        .gradient-code-header {
            background: #1a1a1a;
        }

        .gradient-chat-bar {
            background: #1a1a1a;
        }

        .gradient-info-item {
            background: #1a1a1a;
        }

        .gradient-info-item:hover {
            background: #1a1a1a;
        }

        .gradient-related {
            background: #1a1a1a;
        }

        .gradient-related:hover {
            background: #1a1a1a;
        }

        .gradient-modal {
            background: #1f2937;
        }

        /* File Tree Styling - VS Code Style */
        .file-tree-item {
            display: flex;
            align-items: center;
            padding: 2px 0;
            cursor: pointer;
            user-select: none;
        }

        .file-tree-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .file-tree-item.active {
            background: rgba(75, 85, 99, 0.5);
        }

        .file-tree-folder {
            font-weight: 500;
            color: #d1d5db;
        }

        .file-tree-file {
            color: #9ca3af;
        }

        .file-tree-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            min-width: 20px;
            cursor: pointer;
            transition: transform 0.2s ease;
            color: #6b7280;
        }

        .file-tree-toggle.expanded {
            transform: rotate(90deg);
        }

        .file-tree-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            margin-right: 6px;
            font-size: 12px;
            flex-shrink: 0;
        }

        .file-tree-label {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 13px;
        }

        .file-tree-children {
            display: flex;
            flex-direction: column;
        }

        .file-tree-children.hidden {
            display: none;
        }

        /* Gradient Border - Subtle */
        .gradient-border-subtle {
            border: 2px solid transparent;
            background: linear-gradient(#1a1a1a, #1a1a1a) padding-box,
                        linear-gradient(135deg, #9ca3af, #6b7280) border-box;
            border-radius: 8px;
        }
    </style>
</head>
<body class="bg-[#0B0B0B] text-gray-100 h-screen">
    <div id="root" class="w-screen h-screen flex flex-col overflow-hidden">
        <!-- Header -->
        <header class="gradient-header border-b border-gray-700/30 px-6 py-4 flex items-center justify-between shadow-lg">
            <div class="flex items-center gap-3">
                <div class="gradient-logo w-10 h-10 rounded-lg flex items-center justify-center text-xl text-white">
                    <i class="fas fa-code"></i>
                </div>
                <h1 class="text-3xl font-bold gradient-text">RepoMind</h1>
            </div>
            <!-- Center: Codebase Selector -->
            <div class="flex items-center gap-3">
                <select id="codebaseSelect" class="gradient-border-subtle bg-[#1a1a1a] text-gray-100 text-sm cursor-pointer transition-all duration-200 focus:outline-none focus:shadow-lg focus:shadow-gray-600/20">
                    <option value="">-- Choose a Codebase --</option>
                    <option value="AskLegal">AskLegal AI</option>
                    <option value="Calculator">Calculator</option>
                </select>
                <button class="bg-[#1a1a1a] border border-gray-600 rounded-lg px-3 py-2 font-bold text-white text-sm cursor-pointer transition-all duration-200 hover:shadow-gray-700/40 hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0" id="newCodebaseBtn" title="Ingest a new codebase">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
            <!-- Right: Control Buttons -->
            <div class="flex items-center gap-2">
                <button class="w-10 h-10 rounded-lg border-none bg-transparent text-gray-400 cursor-pointer transition-all duration-200 hover:bg-gray-700/50 hover:text-gray-200 flex items-center justify-center" id="refreshBtn" title="Refresh Data">
                    <i class="fas fa-arrows-rotate"></i>
                </button>
                <button class="w-10 h-10 rounded-lg border-none bg-transparent text-gray-400 cursor-pointer transition-all duration-200 hover:bg-gray-700/50 hover:text-gray-200 flex items-center justify-center" id="settingsBtn" title="Settings">
                    <i class="fas fa-gear"></i>
                </button>
            </div>
        </header>

        <!-- Main Container -->
        <div class="flex-1 flex gap-6 p-6 overflow-hidden bg-[#0B0B0B]">
            <!-- Sidebar Left -->
            <div class="w-72 flex flex-col gap-4 overflow-y-auto pr-2">
                <!-- File Tree -->
                <div class="bg-[#131313] flex-1 border border-gray-700 rounded-xl p-4 hover:border-gray-600 hover:shadow-lg hover:shadow-gray-700/10 transition-all duration-200 flex flex-col overflow-hidden">
                    <div class="panel-title uppercase text-xs font-bold text-gray-400 tracking-wider mb-3">File Structure</div>
                    <div id="fileTree" class="flex-1 overflow-y-auto text-sm text-gray-400">
                        Select a codebase to view files
                    </div>
                </div>
            </div>

            <!-- Center Content -->
            <div class="flex-1 flex flex-col gap-4 overflow-hidden">
                <!-- Stats Grid -->
                <div id="statsContainer" class="grid grid-cols-5 gap-2"></div>

                <!-- Code Preview -->
                <div class="bg-[#131313] flex-1 border border-gray-700 rounded-xl flex flex-col overflow-hidden shadow-lg shadow-black/40">
                    <div class="flex items-center justify-between p-4 border-b border-gray-700">
                        <div class="flex items-center gap-3 text-sm">
                            <i class="fas fa-file-code text-cyan-400"></i>
                            <span id="previewFileName">Select a file to preview</span>
                        </div>
                        <button id="closePreviewBtn" class="bg-none border-none text-gray-400 cursor-pointer text-base hidden hover:text-gray-200">
                            <i class="fas fa-xmark"></i>
                        </button>
                    </div>
                    <div id="codePreview" class="bg-[#131313] code-content flex-1 overflow-auto p-6 text-sm leading-relaxed text-gray-100">
                        <p>Welcome to RepoMind</p>
                        <p class="mt-4 text-gray-400">Select a codebase and file to preview its contents.</p>
                    </div>
                </div>
            </div>

            <!-- Sidebar Right -->
            <div class="w-80 flex flex-col gap-4 overflow-y-auto pl-2">
                <!-- Quick Info -->
                <div class="bg-[#131313] border border-gray-700 rounded-xl p-4 hover:border-gray-600 hover:shadow-lg hover:shadow-gray-700/10 transition-all duration-200">
                    <div class="bg-[#131313] panel-title uppercase text-xs font-bold text-gray-400 tracking-wider mb-3">Quick Info</div>
                    <div class="flex flex-col gap-3">
                        <div class="gradient-info-item p-3 rounded-lg border border-gray-600 flex justify-between items-center text-sm transition-all duration-200">
                            <span class="text-gray-400 font-medium">Total Files</span>
                            <span class="font-bold text-gray-200" id="quickFilesCount">-</span>
                        </div>
                        <div class="gradient-info-item p-3 rounded-lg border border-gray-600 flex justify-between items-center text-sm transition-all duration-200">
                            <span class="text-gray-400 font-medium">Languages</span>
                            <span class="font-bold text-gray-200" id="quickLanguages">-</span>
                        </div>
                        <div class="gradient-info-item p-3 rounded-lg border border-gray-600 flex justify-between items-center text-sm transition-all duration-200">
                            <span class="text-gray-400 font-medium">Code Lines</span>
                            <span class="font-bold text-gray-200" id="quickLines">-</span>
                        </div>
                        <div class="gradient-info-item p-3 rounded-lg border border-gray-600 flex justify-between items-center text-sm transition-all duration-200">
                            <span class="text-gray-400 font-medium">Health Score</span>
                            <span class="font-bold text-gray-200" id="quickHealth">-</span>
                        </div>
                    </div>
                </div>

                <!-- Related Files -->
                <div class="bg-[#131313] flex-1 border border-gray-700 rounded-xl p-4 hover:border-gray-600 hover:shadow-lg hover:shadow-gray-700/10 transition-all duration-200 flex flex-col overflow-hidden">
                    <div class="panel-title uppercase text-xs font-bold text-gray-400 tracking-wider mb-3">Related Files</div>
                    <div id="relatedFiles" class="flex-1 overflow-y-auto text-sm">
                        <div class="text-gray-400">No files related</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chat Bar -->
        <div class="border-t border-gray-700 px-6 py-4 shadow-2xl shadow-black/50">
            <div class="bg-[#131313] flex gap-3">
                <input 
                    type="text"
                    id="chatInput"
                    placeholder="Ask about your codebase... (e.g., 'Show authentication logic')"
                    class="font-Geist Mono Regular flex-1 bg-[#1a1a1a] border border-gray-600 rounded-xl px-4 py-3 text-gray-100 text-sm transition-all duration-200 placeholder-gray-400 focus:outline-none focus:border-gray-500 focus:shadow-lg focus:shadow-gray-600/20"
                >
                <button class="bg-[#1a1a1a] border border-gray-600 px-6 py-3 font-bold text-white rounded-xl cursor-pointer transition-all duration-200 hover:shadow-gray-700/40 hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0 min-w-max" id="sendBtn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="newCodebaseModal" class="modal fixed inset-0 bg-black/60 backdrop-blur-sm flex justify-center items-center z-50 hidden">
        <div class="border border-gray-700 rounded-2xl p-8 w-96 shadow-2xl shadow-black/60">
            <div class="modal-title text-2xl font-bold mb-6 text-white">New Codebase</div>
            <input type="text" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-gray-100 text-sm mb-4 transition-all duration-200 placeholder-gray-400 focus:outline-none focus:border-gray-500 focus:shadow-lg focus:shadow-gray-600/20 focus:bg-gray-700" id="codebaseNameInput" placeholder="Codebase name">
            <input type="text" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-gray-100 text-sm mb-4 transition-all duration-200 placeholder-gray-400 focus:outline-none focus:border-gray-500 focus:shadow-lg focus:shadow-gray-600/20 focus:bg-gray-700" id="codebasePathInput" placeholder="Repository path">
            <div class="flex gap-4 mt-6">
                <button class="flex-1 bg-gray-700 text-gray-100 border-none rounded-lg px-4 py-3 font-bold cursor-pointer transition-all duration-200 hover:bg-gray-600" id="closeModalBtn">Cancel</button>
                <button class="gradient-btn flex-1 text-white border-none rounded-lg px-4 py-3 font-bold cursor-pointer transition-all duration-200 hover:shadow-gray-700/30 hover:shadow-lg hover:-translate-y-0.5" id="submitCodebaseBtn">Ingest</button>
            </div>
        </div>
    </div>

    <script>
        const app = {
            codebases: {
                'AskLegal': {
                    name: 'AskLegal AI',
                    language: 'Python/JavaScript',
                    files: [
                        'app.py', 'laws_generate.py', 'views/chatbotLegalv2.py',
                        'views/docGen.py', 'views/judgmentPred.py'
                    ]
                },
                'Calculator': {
                    name: 'Calculator',
                    language: 'Java',
                    files: [
                        'Calculator.java', 'Main.java', 'tests/CalculatorTest.java'
                    ]
                }
            },
            currentCodebase: null,

            init() {
                this.attachEvents();
                this.updateStats();
            },

            attachEvents() {
                document.getElementById('codebaseSelect').addEventListener('change', (e) => this.selectCodebase(e.target.value));
                document.getElementById('newCodebaseBtn').addEventListener('click', () => this.openModal());
                document.getElementById('closeModalBtn').addEventListener('click', () => this.closeModal());
                document.getElementById('submitCodebaseBtn').addEventListener('click', () => this.submitCodebase());
                document.getElementById('sendBtn').addEventListener('click', () => this.sendChat());
                document.getElementById('chatInput').addEventListener('keypress', (e) => e.key === 'Enter' && this.sendChat());
                document.getElementById('refreshBtn').addEventListener('click', () => this.refresh());
                document.getElementById('closePreviewBtn').addEventListener('click', () => this.closePreview());
                document.getElementById('newCodebaseModal').addEventListener('click', (e) => {
                    if (e.target.id === 'newCodebaseModal') this.closeModal();
                });
            },

            selectCodebase(key) {
                this.currentCodebase = key;
                this.updateFileTree();
                this.updateStats();
                this.updateQuickInfo();
                this.updateRelatedFiles();
            },

            updateFileTree() {
                const container = document.getElementById('fileTree');
                container.innerHTML = '';

                if (!this.currentCodebase) {
                    container.innerHTML = '<div class="text-gray-400 text-sm p-2">Select a codebase to view files</div>';
                    return;
                }

                const files = this.codebases[this.currentCodebase].files;
                const tree = {};

                // Build tree structure
                files.forEach(file => {
                    const parts = file.split('/');
                    let current = tree;
                    parts.forEach((part, index) => {
                        if (!current[part]) {
                            current[part] = { isFolder: index < parts.length - 1, children: {}, fullPath: parts.slice(0, index + 1).join('/') };
                        }
                        if (current[part].isFolder && index < parts.length - 1) {
                            if (!current[part].children) current[part].children = {};
                            current = current[part].children;
                        }
                    });
                });

                // Render tree
                const renderFolder = (items, depth = 0) => {
                    const fragment = document.createDocumentFragment();
                    Object.entries(items).forEach(([name, item]) => {
                        if (item.isFolder) {
                            const folderEl = document.createElement('div');
                            folderEl.className = 'flex flex-col';
                            
                            const folderHeader = document.createElement('div');
                            folderHeader.className = 'file-tree-item file-tree-folder';
                            folderHeader.style.paddingLeft = (depth * 16 + 4) + 'px';
                            
                            const toggle = document.createElement('span');
                            toggle.className = 'file-tree-toggle expanded';
                            toggle.innerHTML = '▶';
                            
                            const icon = document.createElement('span');
                            icon.className = 'file-tree-icon';
                            icon.innerHTML = '📁';
                            
                            const label = document.createElement('span');
                            label.className = 'file-tree-label';
                            label.textContent = name;
                            
                            folderHeader.appendChild(toggle);
                            folderHeader.appendChild(icon);
                            folderHeader.appendChild(label);
                            
                            const childrenContainer = document.createElement('div');
                            childrenContainer.className = 'file-tree-children';
                            childrenContainer.appendChild(renderFolder(item.children || {}, depth + 1));
                            
                            let isExpanded = true;
                            folderHeader.addEventListener('click', (e) => {
                                e.stopPropagation();
                                isExpanded = !isExpanded;
                                toggle.classList.toggle('expanded');
                                childrenContainer.classList.toggle('hidden');
                            });
                            
                            folderEl.appendChild(folderHeader);
                            folderEl.appendChild(childrenContainer);
                            fragment.appendChild(folderEl);
                        } else {
                            const fileEl = document.createElement('div');
                            fileEl.className = 'file-tree-item file-tree-file';
                            fileEl.style.paddingLeft = (depth * 16 + 24) + 'px';
                            
                            const ext = name.split('.').pop();
                            const iconMap = { py: '🐍', java: '☕', js: '⚙️', html: '🌐', css: '🎨', json: '{}' };
                            const icon = document.createElement('span');
                            icon.className = 'file-tree-icon';
                            icon.textContent = iconMap[ext] || '📄';
                            
                            const label = document.createElement('span');
                            label.className = 'file-tree-label';
                            label.textContent = name;
                            
                            fileEl.appendChild(icon);
                            fileEl.appendChild(label);
                            
                            fileEl.addEventListener('click', (e) => {
                                e.stopPropagation();
                                document.querySelectorAll('.file-tree-item').forEach(el => el.classList.remove('active'));
                                fileEl.classList.add('active');
                                this.previewFile(item.fullPath);
                            });
                            
                            fragment.appendChild(fileEl);
                        }
                    });
                    return fragment;
                };

                container.appendChild(renderFolder(tree));
            },

            previewFile(file) {
                document.getElementById('previewFileName').textContent = file;
                const preview = document.getElementById('codePreview');
                document.getElementById('closePreviewBtn').style.display = 'block';

                const mockCode = {
                    'app.py': `# Flask Application Entry Point
from flask import Flask, render_template, request
import os

app = Flask(__name__)

@app.route('/')
def index():
    return render_template('index.html')

@app.route('/api/chat', methods=['POST'])
def chat():
    data = request.get_json()
    return {'response': 'Processing...'}

if __name__ == '__main__':
    app.run(debug=True)`,
                    'Calculator.java': `public class Calculator {
    public double add(double a, double b) {
        return a + b;
    }
    
    public double subtract(double a, double b) {
        return a - b;
    }
    
    public double multiply(double a, double b) {
        return a * b;
    }
    
    public double divide(double a, double b) {
        if (b == 0) throw new ArithmeticException();
        return a / b;
    }
}`
                };

                const code = mockCode[file.split('/').pop()] || `// File: ${file}\n// Content preview...`;
                let html = '<pre style="margin: 0;">';
                code.split('\n').forEach((line, i) => {
                    html += `<div style="padding: 0.25rem 0;"><span style="color: #6b7280; margin-right: 1em;">${i + 1}</span>${this.syntaxHighlight(line)}</div>`;
                });
                html += '</pre>';
                preview.innerHTML = html;
            },

            syntaxHighlight(line) {
                return line
                    .replace(/\b(def|class|import|from|return|if|else|public|private|static)\b/g, '<span style="color: #a78bfa; font-weight: 600;">$1</span>')
                    .replace(/(["'])(?:(?=(\\?))\2.)*?\1/g, '<span style="color: #34d399;">$&</span>')
                    .replace(/(#|\/\/)(.*)/g, '<span style="color: #6b7280; font-style: italic;">$&</span>');
            },

            updateStats() {
                const container = document.getElementById('statsContainer');
                container.innerHTML = '';

                const stats = [
                    { label: 'Files', value: this.currentCodebase ? this.codebases[this.currentCodebase].files.length : '0', icon: 'file' },
                    { label: 'Languages', value: this.currentCodebase ? 2 : 0, icon: 'code' },
                    { label: 'Lines of Code', value: this.currentCodebase ? '5,234' : '0', icon: 'lines' },
                    { label: 'Complexity', value: this.currentCodebase ? 'High' : '-', icon: 'gauge' },
                    { label: 'Health', value: this.currentCodebase ? '78%' : '-', icon: 'heart' }
                ];

                stats.forEach(stat => {
                    const card = document.createElement('div');
                    card.className = 'stat-card relative rounded-xl p-4 border border-gray-600 transition-all duration-300 cursor-pointer hover:border-gray-500 hover:shadow-gray-700/20 hover:shadow-lg hover:-translate-y-1';
                    card.innerHTML = `
                        <div class="stat-label uppercase text-xs font-bold text-gray-400 tracking-wider mb-2"><i class="fas fa-${stat.icon}"></i> ${stat.label}</div>
                        <div class="gradient-stat-value text-3xl font-bold">${stat.value}</div>
                    `;
                    container.appendChild(card);
                });
            },

            updateQuickInfo() {
                if (!this.currentCodebase) {
                    document.getElementById('quickFilesCount').textContent = '-';
                    document.getElementById('quickLanguages').textContent = '-';
                    document.getElementById('quickLines').textContent = '-';
                    document.getElementById('quickHealth').textContent = '-';
                    return;
                }

                document.getElementById('quickFilesCount').textContent = this.codebases[this.currentCodebase].files.length;
                document.getElementById('quickLanguages').textContent = '2';
                document.getElementById('quickLines').textContent = '5,234';
                document.getElementById('quickHealth').textContent = '78%';
            },

            updateRelatedFiles() {
                const container = document.getElementById('relatedFiles');
                if (!this.currentCodebase) {
                    container.innerHTML = '<div class="text-gray-400">No files related</div>';
                    return;
                }

                const files = this.codebases[this.currentCodebase].files.slice(0, 3);
                container.innerHTML = files.map(file => `
                    <div class="gradient-related p-3 rounded-lg mb-2 cursor-pointer transition-all duration-200 text-sm border border-gray-700 hover:translate-x-0.5">
                        <div class="font-bold text-gray-200 mb-1">${file.split('/').pop()}</div>
                        <div class="text-xs text-gray-400">${file}</div>
                    </div>
                `).join('');
            },

            openModal() {
                document.getElementById('newCodebaseModal').classList.remove('hidden');
            },

            closeModal() {
                document.getElementById('newCodebaseModal').classList.add('hidden');
                document.getElementById('codebaseNameInput').value = '';
                document.getElementById('codebasePathInput').value = '';
            },

            submitCodebase() {
                const name = document.getElementById('codebaseNameInput').value.trim();
                const path = document.getElementById('codebasePathInput').value.trim();
                if (!name || !path) return alert('Fill all fields');
                this.closeModal();
                alert(`Added: ${name}`);
            },

            sendChat() {
                const input = document.getElementById('chatInput');
                const message = input.value.trim();
                if (!message) return;

                console.log('Chat:', message);
                input.value = '';
                alert(`Query: ${message}`);
            },

            closePreview() {
                document.getElementById('previewFileName').textContent = 'Select a file to preview';
                document.getElementById('codePreview').innerHTML = '<p> Welcome to RepoMind</p><p style="margin-top: 1rem; color: #9ca3af;">Select a codebase and file to preview its contents.</p>';
                document.getElementById('closePreviewBtn').style.display = 'none';
            },

            refresh() {
                alert('Data refreshed!');
                this.updateStats();
            }
        };

        document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
